<div id="living_state_harness_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <div class="flex-container alignitemscenter margin0">
                <b>角色动态状态 Harness</b>
                <span id="lsh_settings_status" class="lsh-status-label">已关闭</span>
            </div>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="lsh_enabled">
                <input id="lsh_enabled" type="checkbox">
                <span>在单角色聊天中启用</span>
            </label>
            <label class="checkbox_label" for="lsh_frozen">
                <input id="lsh_frozen" type="checkbox">
                <span>暂停自动更新状态</span>
            </label>
            <label for="lsh_depth">提示词注入深度</label>
            <select id="lsh_depth" class="text_pole">
                <option value="1">1 — 最近</option>
                <option value="2">2 — 均衡</option>
                <option value="4">4 — 较远</option>
            </select>
            <label for="lsh_updater_model">状态更新模型（不改变正文模型）</label>
            <select id="lsh_updater_model" class="text_pole">
                <option value="deepseek-v4-flash">deepseek-v4-flash — 推荐</option>
                <option value="deepseek-v4-pro">deepseek-v4-pro — 推理较慢</option>
                <option value="">使用当前正文模型</option>
            </select>
            <label for="lsh_archive_model">长对话归档模型（独立设置）</label>
            <select id="lsh_archive_model" class="text_pole">
                <option value="deepseek-v4-pro">deepseek-v4-pro — 推荐，细节保留更好</option>
                <option value="deepseek-v4-flash">deepseek-v4-flash — 更快，但长剧情容易遗漏</option>
                <option value="">使用当前正文模型</option>
            </select>
            <label for="lsh_response_tokens">更新器最大输出 Token</label>
            <input id="lsh_response_tokens" class="text_pole" type="number" min="8192" max="16384" step="1024">
            <label for="lsh_message_window">每次最多分析的新消息数</label>
            <input id="lsh_message_window" class="text_pole" type="number" min="2" max="50" step="1">
            <label for="lsh_archive_keep_recent">归档续聊保留的最近原文数</label>
            <input id="lsh_archive_keep_recent" class="text_pole" type="number" min="10" max="50" step="1">
            <small class="lsh-muted">默认保留最近 20 条原始消息；更高更稳但节省的 Token 较少。原聊天始终完整保留。</small>
            <hr>
            <h4>创作导向</h4>
            <label for="lsh_state_influence">角色状态对正文的影响</label>
            <select id="lsh_state_influence" class="text_pole">
                <option value="subtle">轻 — 仅在直接相关时体现</option>
                <option value="balanced">均衡 — 推荐</option>
                <option value="strong">强 — 明显影响角色选择</option>
            </select>
            <label for="lsh_initiative">角色主动性</label>
            <select id="lsh_initiative" class="text_pole">
                <option value="restrained">克制 — 多观察和可逆反应</option>
                <option value="natural">自然 — 推荐</option>
                <option value="assertive">积极 — 主动追求目标和边界</option>
            </select>
            <label for="lsh_pacing">剧情推进节奏</label>
            <select id="lsh_pacing" class="text_pole">
                <option value="patient">留白 — 少引入新发展</option>
                <option value="responsive">响应式 — 推荐，推进后留出决策空间</option>
                <option value="forward">向前 — 允许一个清晰的新发展</option>
            </select>
            <label for="lsh_user_micro_agency">用户微互动代写</label>
            <select id="lsh_user_micro_agency" class="text_pole">
                <option value="minimal">最少 — 不补用户台词或动作</option>
                <option value="natural">自然 — 推荐，仅补低风险即时反应</option>
                <option value="expressive">丰富 — 立场已明确时可补短交流</option>
            </select>
            <small class="lsh-muted">这些是软导向，不规定正文格式或字数。用户的关键决定、承诺、升级行为与私人心理始终是不可调的硬红线。</small>
            <hr>
            <label class="checkbox_label" for="lsh_recover_reasoning_story">
                <input id="lsh_recover_reasoning_story" type="checkbox">
                <span>正文误入 reasoning 时自动恢复（仅限完整 &lt;content&gt;）</span>
            </label>
            <label for="lsh_author_locks">作者约束（每行一条）</label>
            <textarea id="lsh_author_locks" class="text_pole textarea_compact" rows="4"></textarea>
            <div class="flex-container">
                <button id="lsh_open_panel" class="menu_button menu_button_icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                    <span>打开状态面板</span>
                </button>
                <button id="lsh_rebuild" class="menu_button menu_button_icon" title="清除快照，并在下一轮重新建立">
                    <i class="fa-solid fa-rotate"></i>
                    <span>下一轮重新建立</span>
                </button>
                <button id="lsh_calibrate" class="menu_button menu_button_icon" title="检查并清理已完成、失效或重复的状态项目">
                    <i class="fa-solid fa-broom"></i>
                    <span>校准当前状态</span>
                </button>
                <button id="lsh_undo_calibration" class="menu_button menu_button_icon" title="恢复校准前保留的状态快照">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>撤销上次校准</span>
                </button>
            </div>
            <small class="lsh-muted">仅追踪当前 char 的内在状态、自主性与剧情连续性；不注入正文格式或字数硬约束，创作档位只作为软导向，也不修改原生 thinking/reasoning 设置。若完整正文误入 reasoning，只恢复正文并保留其余思考。</small>
        </div>
    </div>
</div>
